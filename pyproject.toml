[project]
name = "bcikit-studio"
version = "0.1.1"
description = "BCIKit Studio for acquisition, recording, markers, and replay"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp>=3.11,<4",
  "bleak>=0.22,<1",
  "numpy>=2.1,<3",
  "platformdirs>=4.3,<5",
  "pyedflib>=0.1.39,<0.2",
  "pyqtgraph>=0.13.7,<0.15",
  "pyside6-essentials>=6.8,<6.11; sys_platform != 'linux' or platform_machine != 'aarch64'",
  "pyside6-essentials>=6.7.3,<6.8; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "qasync>=0.27,<1",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "nuitka>=2.8,<3",
  "pip>=25,<27",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[project.gui-scripts]
bcikit-studio = "bcikit_studio.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["bcikit_protocol"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bcikit = ["py.typed"]
bcikit_studio = ["py.typed", "resources/*.svg", "resources/*.icns"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests", "sdk/python/tests"]

[tool.ruff]
exclude = ["sdk/python"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
packages = ["bcikit", "bcikit_studio"]
